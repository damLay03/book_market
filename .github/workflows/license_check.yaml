name: license_check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - ".github/workflows/license_check.yaml"
  push:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - ".github/workflows/license_check.yaml"

jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      flutter_version: "3.47.5"
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
      # very_good_cli 1.1.0 cannot classify this package's Apache-2.0 LICENSE.
      # The license file was reviewed explicitly; skip only this false positive.
      skip_packages: "pubspec_lock_parse"
